name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # `npm test` runs with coverage, and package.json holds the suite to 100%
      # on statements, branches, functions and lines - so this step fails on an
      # untested line as readily as on a failing assertion.
      - name: Test
        run: npm test -- --ci

      # A dependency that quietly doubles the bundle is not something the other
      # steps can see. The ceiling is the measured baseline plus headroom, so it
      # catches a step change rather than nagging about ordinary growth.
      - name: Check bundle size
        run: npm run bundle:check
