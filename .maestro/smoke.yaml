# Needs a real build installed (npx expo run:ios / run:android) - this appId
# does not exist under Expo Go.
appId: com.jossyfreelancer.pokedex
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Bulbasaur.*'
    timeout: 30000

- tapOn: 'Search Pokémon by name or number'
- inputText: 'pika'
- extendedWaitUntil:
    visible: 'Pikachu.*'
    timeout: 10000

- tapOn: 'Pikachu.*'
- extendedWaitUntil:
    visible: 'Base Stats'
    timeout: 20000
- assertVisible: 'Breeding'

- tapOn: 'Go back'
- assertVisible: 'Pikachu.*'
