# Expo Go variant of smoke.yaml - needs `npx expo start` running first.
appId: host.exp.Exponent
---
- stopApp
- openLink: 'exp://127.0.0.1:8081'

- extendedWaitUntil:
    visible: 'Search Pokémon by name or number'
    timeout: 60000

- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- waitForAnimationToEnd

- retry:
    maxRetries: 2
    commands:
      - tapOn: 'Search Pokémon by name or number'
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
            - tapOn: 'Search Pokémon by name or number'
      - waitForAnimationToEnd
      - eraseText
      - inputText: 'pika'
      - extendedWaitUntil:
          visible: 'Pikachu, #025'
          timeout: 15000

- tapOn: 'Pikachu, #025'
- extendedWaitUntil:
    visible: 'Base Stats'
    timeout: 20000
- assertVisible: 'Breeding'

- tapOn: 'Go back'
- assertVisible: 'Pikachu, #025'
